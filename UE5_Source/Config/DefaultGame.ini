; DefaultGame.ini
; ═══════════════════════════════════════════════════════════════════════════
;  Configuración de juego del proyecto AlsasuaManifa (UE 5.4).
;  Fija el GameMode, el pawn, el PlayerController y el HUD por defecto.
; ═══════════════════════════════════════════════════════════════════════════

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=AlsasuaManifa
ProjectID=AlsasuaManifa
Description=Altsasu Manifa — juego de mundo abierto (Alsasua/Navarra).

[/Script/Engine.GameModeBase]
DefaultGameMode=/Script/AlsasuaManifa.AlsasuaGameMode

; Clases por defecto del GameMode (sobreescribibles por un Blueprint del GameMode).
[/Script/AlsasuaManifa.AlsasuaGameMode]
DefaultPawnClass=/Script/AlsasuaManifa.AlsasuaCharacter
PlayerControllerClass=/Script/AlsasuaManifa.AlsasuaPlayerController
HUDClass=/Script/AlsasuaManifa.AlsasuaHUD
