; DefaultInput.ini
; ═══════════════════════════════════════════════════════════════════════════
;  Configuración de entrada del proyecto AlsasuaManifa (UE 5.4).
;  Habilita Enhanced Input a nivel de motor: fuerza las clases de input por
;  defecto a sus versiones "Enhanced" para todos los jugadores.
; ═══════════════════════════════════════════════════════════════════════════

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/EnhancedInput.EnhancedInputProjectSettings]
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultEnhancedInputMappingContextClass=/Script/EnhancedInput.InputMappingContext
