<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Altsasu Manifa — Grafo de dependencias</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b24; --texto:#d8dee9; --muted:#7b8494; --borde:#2a3140;
    --core:#e5c07b; --world:#61afef; --entities:#98c379; --gameplay:#e06c75; --ui:#c678dd; --eventos:#56b6c2; --editor:#5c6370;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--texto);font:13px/1.4 'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
  #lienzo{position:absolute;inset:0;cursor:grab}
  #lienzo.arrastrando{cursor:grabbing}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:12px}
  #controles{top:12px;left:12px;width:240px;max-height:calc(100vh - 24px);overflow-y:auto}
  #controles h1{font-size:15px;margin-bottom:2px}
  #controles .sub{color:var(--muted);font-size:11px;margin-bottom:10px}
  #buscar{width:100%;background:#0b0e13;border:1px solid var(--borde);border-radius:6px;color:var(--texto);padding:6px 8px;margin-bottom:10px;outline:none}
  #buscar:focus{border-color:var(--world)}
  .grupo{margin-bottom:10px}
  .grupo h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  label.fila{display:flex;align-items:center;gap:7px;padding:3px 2px;cursor:pointer;border-radius:5px;user-select:none}
  label.fila:hover{background:#1d2430}
  .punto{width:10px;height:10px;border-radius:50%;flex:none}
  .cuad{width:18px;height:3px;flex:none;border-radius:2px}
  .cnt{margin-left:auto;color:var(--muted);font-size:11px}
  #info{top:12px;right:12px;width:300px;display:none;max-height:calc(100vh - 24px);overflow-y:auto}
  #info h2{font-size:15px;margin-bottom:4px}
  #info .ruta{color:var(--muted);font-size:11px;word-break:break-all;margin-bottom:8px}
  #info .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-bottom:8px}
  #info h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 4px}
  #info .dep{padding:2px 0;font-size:12px;cursor:pointer}
  #info .dep:hover{color:#fff;text-decoration:underline}
  #info .dep .tipo{color:var(--muted);font-size:10px;margin-left:6px}
  #ayuda{bottom:12px;left:12px;color:var(--muted);font-size:11px;background:transparent;border:none;padding:0}
  #cerrar{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}
  button.mini{background:#0b0e13;border:1px solid var(--borde);color:var(--texto);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;margin-right:6px}
  button.mini:hover{border-color:var(--world)}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>

<div class="panel" id="controles">
  <h1>Altsasu Manifa</h1>
  <div class="sub">Grafo de dependencias · 212 clases · 1186 enlaces</div>
  <input id="buscar" placeholder="Buscar clase… (ej. SistemaZonas)">
  <div class="grupo"><h2>Capas</h2><div id="capas"></div></div>
  <div class="grupo"><h2>Tipo de enlace</h2><div id="tipos"></div></div>
  <div class="grupo">
    <button class="mini" id="btnReset">Recentrar</button>
    <button class="mini" id="btnCongelar">Congelar</button>
  </div>
</div>

<div class="panel" id="info">
  <button id="cerrar">✕</button>
  <h2 id="infoNombre"></h2>
  <div class="ruta" id="infoRuta"></div>
  <span class="badge" id="infoCapa"></span>
  <div id="infoLoc" style="font-size:11px;color:var(--muted)"></div>
  <h3>Depende de (salientes)</h3><div id="infoSal"></div>
  <h3>Usado por (entrantes)</h3><div id="infoEnt"></div>
</div>

<div class="panel" id="ayuda">arrastra nodos · rueda = zoom · clic fondo = deseleccionar · doble clic nodo = aislar vecindario</div>

","t":"SistemaVolumenHDRP","tipo":"referencia","w":2},{"s":"SistemaAPVScenarios","t":"AlsasuaLogger","tipo":"referencia","w":3},{"s":"SistemaFacciones","t":"SingletonMono","tipo":"herencia","w":1},{"s":"SistemaFacciones","t":"IFactionService","tipo":"herencia","w":1},{"s":"SistemaFacciones","t":"CoherenciaUmbralEvent","tipo":"publica","w":1},{"s":"SistemaFacciones","t":"FaccionActivadaEvent","tipo":"publica","w":1},{"s":"SistemaFacciones","t":"FactionReputationChangedEvent","tipo":"publica","w":1},{"s":"SistemaFacciones","t":"ManchaChistorraEvent","tipo":"publica","w":1},{"s":"SistemaFacciones","t":"ServiceLocator","tipo":"referencia","w":3},{"s":"SistemaFacciones","t":"EventBus","tipo":"referencia","w":7},{"s":"SistemaFacciones","t":"AlsasuaLogger","tipo":"referencia","w":2},{"s":"SistemaFacciones","t":"SistemaApoyoPopular","tipo":"referencia","w":4},{"s":"SistemaFacciones","t":"SistemaGuardado","tipo":"referencia","w":1},{"s":"SistemaFachadasDinamicas","t":"SistemaClima","tipo":"referencia","w":1},{"s":"SistemaFachadasDinamicas","t":"SistemaEdificiosAAA","tipo":"referencia","w":1},{"s":"SistemaFachadasDinamicas","t":"AlsasuaLogger","tipo":"referencia","w":1},{"s":"SistemaImpostores","t":"SistemaEdificiosAAA","tipo":"referencia","w":4},{"s":"SistemaImpostores","t":"AlsasuaLogger","tipo":"referencia","w":1},{"s":"SistemaMusicaAdaptativa","t":"IWantedSystem","tipo":"servicio","w":1},{"s":"SistemaMusicaAdaptativa","t":"ServiceLocator","tipo":"referencia","w":2},{"s":"SistemaMusicaAdaptativa","t":"SistemaOpciones","tipo":"referencia","w":2},{"s":"SistemaMusicaAdaptativa","t":"AlsasuaLogger","tipo":"referencia","w":2},{"s":"SistemaTelemetria","t":"DiagnosticoGrafico","tipo":"referencia","w":1},{"s":"SistemaTelemetria","t":"SmokeTestRunner","tipo":"referencia","w":1}]};

const COLORES = {CORE:'#e5c07b',WORLD:'#61afef',ENTITIES:'#98c379',GAMEPLAY:'#e06c75',UI:'#c678dd',EVENTOS:'#56b6c2',EDITOR:'#5c6370'};
const TIPOCOLOR = {herencia:'#e5c07b',servicio:'#e06c75',publica:'#56b6c2',suscribe:'#56b6c2',referencia:'#3b4452'};
const TIPONOMBRE = {herencia:'Herencia',servicio:'ServiceLocator',publica:'EventBus publica',suscribe:'EventBus suscribe',referencia:'Referencia directa'};

const nodos = DATA.nodes.map(n=>({...n, x:(Math.random()-0.5)*1800, y:(Math.random()-0.5)*1200, vx:0, vy:0,
  r: Math.max(5, Math.min(16, 4+Math.sqrt(n.loc)/4))}));
const porId = Object.fromEntries(nodos.map(n=>[n.id,n]));
const aristas = DATA.edges.filter(e=>porId[e.s]&&porId[e.t]);

// grados
const gradoEnt = {}, gradoSal = {};
aristas.forEach(e=>{gradoSal[e.s]=(gradoSal[e.s]||0)+1; gradoEnt[e.t]=(gradoEnt[e.t]||0)+1;});

// estado de filtros
const capasOn = {CORE:true,WORLD:true,ENTITIES:true,GAMEPLAY:true,UI:true,EVENTOS:true,EDITOR:false};
const tiposOn = {herencia:true,servicio:true,publica:true,suscribe:true,referencia:true};
let seleccionado=null, aislado=null, busqueda='', congelado=false;

// UI capas
const cuentaCapas = {};
nodos.forEach(n=>cuentaCapas[n.capa]=(cuentaCapas[n.capa]||0)+1);
const divCapas = document.getElementById('capas');
Object.keys(COLORES).forEach(c=>{
  const l = document.createElement('label'); l.className='fila';
  l.innerHTML = `<input type="checkbox" ${capasOn[c]?'checked':''}><span class="punto" style="background:${COLORES[c]}"></span>${c}<span class="cnt">${cuentaCapas[c]||0}</span>`;
  l.querySelector('input').onchange = e=>{capasOn[c]=e.target.checked; calentar();};
  divCapas.appendChild(l);
});
const divTipos = document.getElementById('tipos');
Object.keys(TIPONOMBRE).forEach(t=>{
  const l = document.createElement('label'); l.className='fila';
  l.innerHTML = `<input type="checkbox" checked><span class="cuad" style="background:${TIPOCOLOR[t]}"></span>${TIPONOMBRE[t]}`;
  l.querySelector('input').onchange = e=>{tiposOn[t]=e.target.checked;};
  divTipos.appendChild(l);
});
document.getElementById('buscar').oninput = e=>{busqueda=e.target.value.toLowerCase();};
document.getElementById('btnReset').onclick = ()=>{cam={x:0,y:0,z:0.5}; calentar();};
document.getElementById('btnCongelar').onclick = function(){congelado=!congelado; this.textContent=congelado?'Reanudar':'Congelar'; if(!congelado)calentar();};
document.getElementById('cerrar').onclick = ()=>{seleccionado=null; aislado=null; document.getElementById('info').style.display='none';};

function visible(n){ return capasOn[n.capa] && (!aislado || aislado.has(n.id)); }
function aristaVisible(e){ return tiposOn[e.tipo] && visible(porId[e.s]) && visible(porId[e.t]); }

// física
let alpha = 1;
function calentar(){ alpha = Math.max(alpha, 0.6); }
function tick(){
  if(congelado || alpha < 0.005) return;
  alpha *= 0.985;
  const vivos = nodos.filter(visible);
  // repulsión O(n²) con corte
  for(let i=0;i<vivos.length;i++){
    const a=vivos[i];
    for(let j=i+1;j<vivos.length;j++){
      const b=vivos[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy;
      if(d2>90000) continue;
      if(d2<1){dx=Math.random()-0.5;dy=Math.random()-0.5;d2=1;}
      const f = 900/d2 * alpha;
      const d=Math.sqrt(d2);
      dx/=d; dy/=d;
      a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
    }
  }
  // atracción por aristas
  aristas.forEach(e=>{
    if(!aristaVisible(e)) return;
    const a=porId[e.s], b=porId[e.t];
    const dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-110)*0.004*alpha;
    a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f;
  });
  // gravedad al centro + por capa (anillos angulares)
  const angCapa = {CORE:0, EVENTOS:0, WORLD:Math.PI*0.5, ENTITIES:Math.PI, GAMEPLAY:Math.PI*1.4, UI:Math.PI*1.8, EDITOR:Math.PI*0.25};
  vivos.forEach(n=>{
    let gx=0, gy=0;
    if(n.capa!=='CORE'&&n.capa!=='EVENTOS'){
      const a=angCapa[n.capa]||0, R=480;
      gx=Math.cos(a)*R; gy=Math.sin(a)*R;
    }
    n.vx+=(gx-n.x)*0.0012*alpha; n.vy+=(gy-n.y)*0.0012*alpha;
    n.vx*=0.85; n.vy*=0.85;
    if(n!==nodoArrastrado){ n.x+=n.vx; n.y+=n.vy; }
  });
}

// render
const cv = document.getElementById('lienzo'), ctx = cv.getContext('2d');
let cam = {x:0,y:0,z:0.5};
function resize(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
addEventListener('resize',resize); resize();

function mundoAPantalla(x,y){ return [(x-cam.x)*cam.z+innerWidth/2, (y-cam.y)*cam.z+innerHeight/2]; }
function pantallaAMundo(px,py){ return [(px-innerWidth/2)/cam.z+cam.x, (py-innerHeight/2)/cam.z+cam.y]; }

function vecinos(id){
  const s=new Set([id]);
  aristas.forEach(e=>{ if(e.s===id)s.add(e.t); if(e.t===id)s.add(e.s); });
  return s;
}

function dibujar(){
  tick();
  ctx.save();
  ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const sel = seleccionado ? vecinos(seleccionado) : null;
  const q = busqueda;

  // aristas
  aristas.forEach(e=>{
    if(!aristaVisible(e)) return;
    const a=porId[e.s], b=porId[e.t];
    const [x1,y1]=mundoAPantalla(a.x,a.y), [x2,y2]=mundoAPantalla(b.x,b.y);
    if(Math.max(x1,x2)<-50||Math.min(x1,x2)>innerWidth+50||Math.max(y1,y2)<-50||Math.min(y1,y2)>innerHeight+50) return;
    let op = e.tipo==='referencia' ? 0.25 : 0.55;
    if(sel){ op = (sel.has(e.s)&&sel.has(e.t)&&(e.s===seleccionado||e.t===seleccionado)) ? 0.9 : 0.04; }
    ctx.strokeStyle = TIPOCOLOR[e.tipo];
    ctx.globalAlpha = op;
    ctx.lineWidth = e.tipo==='referencia' ? 0.8 : 1.6;
    ctx.beginPath(); ctx.moveTo(x1,y1);
    const mx=(x1+x2)/2 + (y2-y1)*0.08, my=(y1+y2)/2 + (x1-x2)*0.08;
    ctx.quadraticCurveTo(mx,my,x2,y2); ctx.stroke();
    // flecha
    if(cam.z>0.45 && op>0.3){
      const ang=Math.atan2(y2-my,x2-mx);
      const fx=x2-Math.cos(ang)*(b.r*cam.z+3), fy=y2-Math.sin(ang)*(b.r*cam.z+3);
      ctx.beginPath();
      ctx.moveTo(fx,fy);
      ctx.lineTo(fx-Math.cos(ang-0.45)*7, fy-Math.sin(ang-0.45)*7);
      ctx.lineTo(fx-Math.cos(ang+0.45)*7, fy-Math.sin(ang+0.45)*7);
      ctx.closePath(); ctx.fillStyle=TIPOCOLOR[e.tipo]; ctx.fill();
    }
  });
  ctx.globalAlpha=1;

  // nodos
  nodos.forEach(n=>{
    if(!visible(n)) return;
    const [x,y]=mundoAPantalla(n.x,n.y);
    if(x<-60||x>innerWidth+60||y<-60||y>innerHeight+60) return;
    const r = n.r*cam.z*1.6;
    const coincide = q && n.id.toLowerCase().includes(q);
    let op = 1;
    if(sel && !sel.has(n.id)) op = 0.12;
    if(q && !coincide) op = 0.15;
    ctx.globalAlpha = op;
    ctx.beginPath();
    if(n.capa==='EVENTOS'){ // rombo
      ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y); ctx.closePath();
    } else ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = COLORES[n.capa]; ctx.fill();
    if(n.id===seleccionado || coincide){
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    }
    if(cam.z>0.55 || n.id===seleccionado || coincide || r>9){
      ctx.fillStyle = op<0.5 ? 'rgba(216,222,233,0.25)' : '#d8dee9';
      ctx.font = `${Math.max(9,11*Math.min(cam.z,1.1))}px 'Segoe UI'`;
      ctx.textAlign='center';
      ctx.fillText(n.id, x, y+r+12);
    }
  });
  ctx.restore();
  requestAnimationFrame(dibujar);
}

// interacción
let nodoArrastrado=null, panActivo=false, ultimo=[0,0];
function nodoEn(px,py){
  const [wx,wy]=pantallaAMundo(px,py);
  let mejor=null, mejorD=1e9;
  nodos.forEach(n=>{
    if(!visible(n)) return;
    const d=Math.hypot(n.x-wx,n.y-wy);
    if(d < Math.max(n.r*1.8, 14/cam.z) && d<mejorD){mejor=n;mejorD=d;}
  });
  return mejor;
}
cv.addEventListener('mousedown',e=>{
  const n=nodoEn(e.clientX,e.clientY);
  if(n){nodoArrastrado=n;} else {panActivo=true; cv.classList.add('arrastrando');}
  ultimo=[e.clientX,e.clientY];
});
addEventListener('mousemove',e=>{
  const dx=e.clientX-ultimo[0], dy=e.clientY-ultimo[1];
  ultimo=[e.clientX,e.clientY];
  if(nodoArrastrado){ nodoArrastrado.x+=dx/cam.z; nodoArrastrado.y+=dy/cam.z; calentar(); }
  else if(panActivo){ cam.x-=dx/cam.z; cam.y-=dy/cam.z; }
});
addEventListener('mouseup',e=>{
  if(nodoArrastrado && Math.hypot(e.clientX-ultimo[0],e.clientY-ultimo[1])<3){}
  nodoArrastrado=null; panActivo=false; cv.classList.remove('arrastrando');
});
cv.addEventListener('click',e=>{
  const n=nodoEn(e.clientX,e.clientY);
  if(n){ seleccionar(n.id); }
  else if(!e.defaultPrevented){ seleccionado=null; aislado=null; document.getElementById('info').style.display='none'; }
});
cv.addEventListener('dblclick',e=>{
  const n=nodoEn(e.clientX,e.clientY);
  if(n){ aislado=vecinos(n.id); calentar(); }
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor = e.deltaY<0 ? 1.12 : 0.89;
  const [wx,wy]=pantallaAMundo(e.clientX,e.clientY);
  cam.z = Math.min(3.5, Math.max(0.12, cam.z*factor));
  const [wx2,wy2]=pantallaAMundo(e.clientX,e.clientY);
  cam.x += wx-wx2; cam.y += wy-wy2;
},{passive:false});

function seleccionar(id){
  seleccionado=id;
  const n=porId[id];
  document.getElementById('info').style.display='block';
  document.getElementById('infoNombre').textContent=n.id;
  document.getElementById('infoRuta').textContent=n.file;
  const b=document.getElementById('infoCapa');
  b.textContent=n.capa; b.style.background=COLORES[n.capa]; b.style.color='#0e1116';
  document.getElementById('infoLoc').textContent = `${n.loc} líneas · ${gradoSal[id]||0} salientes · ${gradoEnt[id]||0} entrantes`;
  const sal=document.getElementById('infoSal'), ent=document.getElementById('infoEnt');
  sal.innerHTML=''; ent.innerHTML='';
  aristas.filter(e=>e.s===id).forEach(e=>{
    const d=document.createElement('div'); d.className='dep';
    d.innerHTML=`→ ${e.t}<span class="tipo">${TIPONOMBRE[e.tipo]}</span>`;
    d.onclick=()=>seleccionar(e.t); sal.appendChild(d);
  });
  aristas.filter(e=>e.t===id).forEach(e=>{
    const d=document.createElement('div'); d.className='dep';
    d.innerHTML=`← ${e.s}<span class="tipo">${TIPONOMBRE[e.tipo]}</span>`;
    d.onclick=()=>seleccionar(e.s); ent.appendChild(d);
  });
  if(!sal.children.length) sal.innerHTML='<div style="color:var(--muted);font-size:11px">— ninguna</div>';
  if(!ent.children.length) ent.innerHTML='<div style="color:var(--muted);font-size:11px">— ninguna</div>';
}

dibujar();
</script>
